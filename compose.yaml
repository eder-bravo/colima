name: colima

services:
  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DATABASE_PATH: /app/data/colima.db
      SAMPLES_DIR: /app/app/static/samples
      TZ: America/Monterrey
    volumes:
      - ./data:/app/data
