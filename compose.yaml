name: colima

services:
  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_PATH: /app/data/colima.db
      INSTRUCTOR_PIN_FILE: /run/secrets/instructor_pin
      SAMPLES_DIR: /app/app/static/samples
      TZ: America/Monterrey
    volumes:
      - /srv/data/colima:/app/data
      - /srv/secrets/colima-instructor-pin:/run/secrets/instructor_pin:ro
    networks:
      edge:
        aliases:
          - colima-web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    group_add:
      - "25001"
    tmpfs:
      - /tmp:size=64m,mode=1777

networks:
  edge:
    external: true
